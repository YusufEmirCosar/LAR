name: Nightly Quality

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan-and-repeat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.2'
          cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang libgl1-mesa-dev
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan --parallel 4
      - run: ctest --preset tsan --parallel 1
      - name: Repeat concurrency contracts 100 times
        run: >-
          ctest --test-dir build-tsan --output-on-failure
          -R '^(larruntime-contract-tests|larsource-lifecycle-tests|larrecording-pipeline-tests|larplayback-service-tests|larmap-loading-tests|larviewport-worker-tests)$'
          --repeat until-fail:100

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.2'
          cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang libgl1-mesa-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel 4
      - name: Run persisted parser corpora for 30 minutes each
        run: >-
          for target in lar-map-reader-fuzz lar-map-source-fuzz
          lar-mapping-repository-fuzz lar-packet-decoder-fuzz
          lar-session-reader-fuzz lar-ip-policy-fuzz lar-dlz-solver-fuzz;
          do ./build-fuzz/$target tests/fuzz/corpus
          -max_total_time=1800 -artifact_prefix=tests/fuzz/corpus/;
          done
      - name: Upload evolved fuzz corpus and crashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lar-fuzz-corpus-${{ github.run_id }}
          path: tests/fuzz/corpus
          if-no-files-found: error

  operational-soak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.2'
          cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang libgl1-mesa-dev
      - run: cmake --preset ci-clang
      - run: cmake --build --preset ci-clang --parallel 4 --target laroperational-soak-tests
      - name: Run 30-minute real-loopback recording soak
        env:
          LAR_SOAK_SECONDS: '1800'
        run: >-
          ctest --test-dir build-ci-clang --output-on-failure
          -R '^laroperational-soak-tests$'
